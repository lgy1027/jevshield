[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevshield"
version = "0.1.2"
description = "Framework-agnostic decision-control SDK for AI agents powered by Jev."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "lgy1027", email = "lgy10271416@gmail.com" },
]
keywords = ["guardrails", "ai-agents", "ai-safety", "jev", "typesafe", "tool-calling", "langchain", "security", "intent-classification", "routing", "decision-control"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0"
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]

[tool.setuptools.packages.find]
include = ["jevshield*", "evals*"]

[tool.setuptools.package-data]
evals = ["cases/*.json"]

[project.urls]
Homepage = "https://github.com/lgy1027/jevshield"
Source = "https://github.com/lgy1027/jevshield"
Documentation = "https://github.com/lgy1027/jevshield#readme"
