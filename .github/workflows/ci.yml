name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with LangChain extra so all tests run)
        run: pip install -e ".[langchain]"

      - name: Run test suite
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distribution packages
        run: |
          pip install build
          python -m build

      - name: Verify wheel installs and imports
        run: |
          pip install dist/*.whl
          python -c "import jevshield; print(jevshield.__all__)"
